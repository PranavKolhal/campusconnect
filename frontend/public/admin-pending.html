<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/email-templates.js"></script>
<script src="js/email-service.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approvals - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pending-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .pending-header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        
        .pending-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .pending-tab {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .pending-tab.active {
            background: var(--gradient);
            color: white;
        }
        
        .pending-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid #f59e0b;
            transition: all 0.3s;
        }
        
        .pending-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-hover);
        }
        
        .pending-card.approved {
            border-left-color: #10b981;
        }
        
        .pending-card.rejected {
            border-left-color: #ef4444;
            opacity: 0.7;
        }
        
        .pending-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .pending-title {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .pending-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: #f59e0b20;
            color: #f59e0b;
        }
        
        .badge-urgent {
            background: #ef444420;
            color: #ef4444;
        }
        
        .organizer-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .organizer-avatar {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .verification-docs {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        .doc-link {
            padding: 5px 10px;
            background: #f1f5f9;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .doc-link:hover {
            background: #e2e8f0;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .approve-btn {
            background: #10b981;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        
        .reject-btn {
            background: #ef4444;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        
        .review-btn {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .rejection-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .rejection-modal.active {
            display: flex;
        }
        
        .rejection-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        
        .rejection-content textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            🚀 CampusConnect Admin
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="admin-pending.html" class="active">Pending Approvals</a>
            <a href="admin-registrations.html">📊 Registrations</a>
            <div id="adminInfo">
                <span class="badge badge-info">Admin</span>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="pending-container">
        <div class="pending-header">
            <h1>👑 Event Approvals</h1>
            <p style="color: var(--gray); margin-top: 10px;">Review and approve events submitted by organizers</p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div>Pending</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="approvedToday">0</div>
                    <div>Approved Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalEvents">0</div>
                    <div>Total Events</div>
                </div>
            </div>
            
            <div class="pending-tabs">
                <button class="pending-tab active" onclick="filterEvents('all')">All</button>
                <button class="pending-tab" onclick="filterEvents('pending')">Pending</button>
                <button class="pending-tab" onclick="filterEvents('approved')">Approved</button>
                <button class="pending-tab" onclick="filterEvents('rejected')">Rejected</button>
            </div>
        </div>

       <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchTab('pending')">⏳ Pending</button>
    <button class="admin-tab" onclick="switchTab('approved')">✅ Approved</button>
    <button class="admin-tab" onclick="switchTab('rejected')">❌ Rejected</button>
    <button class="admin-tab" onclick="switchTab('all')">📋 All Events</button>
    <button class="admin-tab" onclick="switchTab('deleted')">🗑️ Deleted</button>
</div>

<div class="tab-content">
    <!-- Pending Section -->
    <div class="tab-pane active" id="pendingSection">
        <div id="pendingEventsList"></div>
    </div>
    
    <!-- Approved Section -->
    <div class="tab-pane" id="approvedSection">
        <div id="approvedEventsList"></div>
    </div>
    
    <!-- Rejected Section -->
    <div class="tab-pane" id="rejectedSection">
        <div id="rejectedEventsList"></div>
    </div>
    
    <!-- All Events Section -->
    <div class="tab-pane" id="allSection">
        <div id="allEventsList"></div>
    </div>
    
    <!-- Deleted Events Section -->
    <div class="tab-pane" id="deletedSection">
        <div id="deletedEventsList"></div>
    </div>
</div>


        <div id="pendingEventsList">
            <!-- Pending events will be loaded here -->
            <div style="text-align: center; padding: 50px;">Loading pending events...</div>
        </div>
    </div>

    <!-- Rejection Modal -->
    <div class="rejection-modal" id="rejectionModal">
        <div class="rejection-content">
            <h2>Reject Event</h2>
            <p>Please provide feedback for the organizer:</p>
            <textarea id="rejectionReason" placeholder="Why is this event being rejected?"></textarea>
            <div style="display: flex; gap: 15px;">
                <button class="reject-btn" onclick="confirmRejection()">Send Rejection</button>
                <button class="btn" onclick="closeRejectionModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
<script src="js/data-store.js"></script>
<script>
    let currentEventId = null;
    let currentFilter = 'pending';
    let allEvents = [];

    // ===== LOADING FUNCTIONS =====
    function loadPendingEvents() {
        console.log('Loading pending events...');
        
        // Get all events from store
        allEvents = eventStore.getAllEvents();
        console.log('All events from store:', allEvents);
        
        updateStats(allEvents);
        displayEvents(allEvents);
    }

    function displayEvents(events) {
        const container = document.getElementById('pendingEventsList');
        
        if (!container) {
            console.error('Container not found');
            return;
        }
        
        // Filter events based on current filter
        const filteredEvents = events.filter(event => {
            if (!event) return false;
            if (currentFilter === 'all') return true;
            return event.status === currentFilter;
        });

        console.log('Filtered events:', filteredEvents);

        if (filteredEvents.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 3rem;">📭</div>
                    <h3>No ${currentFilter} events</h3>
                    <p style="color: var(--gray); margin-top: 10px;">${currentFilter === 'pending' ? 'No events waiting for approval' : 'No events found'}</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filteredEvents.map(event => `
            <div class="pending-card ${event.status || 'pending'}" id="event-${event.id}">
                <div class="pending-header-row">
                    <span class="pending-title">${event.title || 'Untitled'}</span>
                    <span class="pending-badge badge-${event.status || 'pending'}">
                        ${(event.status || 'PENDING').toUpperCase()}
                    </span>
                </div>
                
                <p style="color: var(--gray); margin: 10px 0;">${event.description || 'No description'}</p>
                
                <div style="display: flex; gap: 20px; margin: 10px 0; flex-wrap: wrap;">
                    <span>📅 ${event.date ? new Date(event.date).toLocaleDateString() : 'TBD'}</span>
                    <span>📍 ${event.location || 'TBD'}</span>
                    <span>⏰ Submitted: ${event.submittedAt ? new Date(event.submittedAt).toLocaleString() : 'Unknown'}</span>
                </div>

                <div class="organizer-info">
                    <div class="organizer-avatar">${(event.organizer?.name || 'U').charAt(0)}</div>
                    <div style="flex: 1;">
                        <h4>${event.organizer?.name || 'Unknown Organizer'}</h4>
                        <p style="color: var(--gray);">${event.organizer?.email || 'No email'}</p>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-outline" onclick="window.location.href='event-details.html?id=${event.id}'">View</button>
                    
                    ${event.status === 'pending' ? `
                        <button class="approve-btn" onclick="approveEvent('${event.id}')">✓ Approve</button>
                        <button class="reject-btn" onclick="showRejectionModal('${event.id}')">✗ Reject</button>
                    ` : ''}
                    
                    <!-- DELETE BUTTON FOR ALL EVENTS -->
                    <button class="btn-danger" onclick="confirmDeleteEvent('${event.id}', '${event.title.replace(/'/g, "\\'")}')">🗑️ Delete</button>
                </div>
            </div>
        `).join('');
    }

    // ===== STATS FUNCTION WITH NULL CHECKS =====
    function updateStats(events) {
        const pendingCount = events.filter(e => e && e.status === 'pending').length;
        const approvedCount = events.filter(e => e && e.status === 'approved').length;
        const rejectedCount = events.filter(e => e && e.status === 'rejected').length;
        
        // Check if elements exist before setting textContent
        const pendingEl = document.getElementById('pendingCount');
        const approvedEl = document.getElementById('approvedCount');
        const rejectedEl = document.getElementById('rejectedCount');
        const totalEl = document.getElementById('totalEvents');
        
        if (pendingEl) pendingEl.textContent = pendingCount;
        if (approvedEl) approvedEl.textContent = approvedCount;
        if (rejectedEl) rejectedEl.textContent = rejectedCount;
        if (totalEl) totalEl.textContent = events.length;
    }

    // ===== DELETE FUNCTIONS =====
    function confirmDeleteEvent(eventId, eventTitle) {
        if (confirm(`⚠️ Are you sure you want to delete "${eventTitle}"?\n\nThis action cannot be undone!`)) {
            deleteEvent(eventId);
        }
    }

    function deleteEvent(eventId) {
        console.log('Deleting event:', eventId);
        
        // Get current admin user
        const admin = getCurrentUser();
        
        // Find the event
        const event = eventStore.getEventById(eventId);
        if (!event) {
            alert('Event not found');
            return;
        }
        
        // Remove from store
        const allEvents = eventStore.getAllEvents();
        const eventIndex = allEvents.findIndex(e => e.id === eventId);
        
        if (eventIndex !== -1) {
            // Store deleted event info
            let deletedLog = JSON.parse(localStorage.getItem('deleted_events') || '[]');
            deletedLog.push({
                ...event,
                deletedAt: new Date().toISOString(),
                deletedBy: admin?.email || 'admin'
            });
            localStorage.setItem('deleted_events', JSON.stringify(deletedLog));
            
            // Remove event
            allEvents.splice(eventIndex, 1);
            eventStore.events = allEvents;
            eventStore.saveToStorage();
            eventStore.triggerUpdate();
            
            alert('✅ Event deleted successfully!');
            loadPendingEvents(); // Refresh the list
        } else {
            alert('❌ Error deleting event');
        }
    }

    // ===== APPROVE/REJECT FUNCTIONS =====
    function approveEvent(eventId) {
        console.log('Approving event:', eventId);
        
        if (confirm('Approve this event? It will appear on the main events page immediately.')) {
            const success = eventStore.approveEvent(eventId);
            
            if (success) {
                loadPendingEvents();
                alert('✅ Event approved and is now live!');
            } else {
                alert('❌ Error approving event');
            }
        }
    }

    function showRejectionModal(eventId) {
        currentEventId = eventId;
        const modal = document.getElementById('rejectionModal');
        if (modal) modal.classList.add('active');
    }

    function closeRejectionModal() {
        const modal = document.getElementById('rejectionModal');
        if (modal) modal.classList.remove('active');
        const reason = document.getElementById('rejectionReason');
        if (reason) reason.value = '';
    }

    function confirmRejection() {
        const reason = document.getElementById('rejectionReason')?.value;
        if (!reason) {
            alert('Please provide a reason for rejection');
            return;
        }

        const success = eventStore.rejectEvent(currentEventId, reason);
        
        if (success) {
            loadPendingEvents();
            closeRejectionModal();
            alert('❌ Event rejected. Feedback sent to organizer.');
        } else {
            alert('❌ Error rejecting event');
        }
    }

    // ===== FILTER FUNCTIONS =====
    function filterEvents(filter) {
        currentFilter = filter;
        
        // Update active tab
        document.querySelectorAll('.pending-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        
        // Find and activate the clicked tab
        const activeTab = Array.from(document.querySelectorAll('.pending-tab')).find(
            tab => tab.textContent.toLowerCase().includes(filter)
        );
        if (activeTab) activeTab.classList.add('active');
        
        // Display filtered events
        displayEvents(allEvents);
    }




    // ===== TAB SWITCHING FUNCTIONS =====
function switchTab(tabName) {
    console.log('Switching to tab:', tabName);
    
    // Update tab buttons
    document.querySelectorAll('.admin-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    
    // Find and activate the clicked tab
    const activeTab = Array.from(document.querySelectorAll('.admin-tab')).find(
        tab => tab.textContent.toLowerCase().includes(tabName)
    );
    if (activeTab) activeTab.classList.add('active');
    
    // Update tab content
    document.querySelectorAll('.tab-pane').forEach(pane => {
        pane.classList.remove('active');
    });
    
    const activePane = document.getElementById(tabName + 'Section');
    if (activePane) {
        activePane.classList.add('active');
    }
    
    // Load data based on tab
    if (tabName === 'pending') {
        loadPendingEvents();
    } else if (tabName === 'approved') {
        loadApprovedEvents();
    } else if (tabName === 'rejected') {
        loadRejectedEvents();
    } else if (tabName === 'all') {
        loadAllEvents();
    } else if (tabName === 'deleted') {
        loadDeletedEvents();
    }
}

// ===== TAB DATA LOADING FUNCTIONS =====
function loadApprovedEvents() {
    const allEvents = eventStore.getAllEvents();
    const approvedEvents = allEvents.filter(e => e && e.status === 'approved');
    displayEventsInTab('approvedEventsList', approvedEvents, 'approved');
}

function loadRejectedEvents() {
    const allEvents = eventStore.getAllEvents();
    const rejectedEvents = allEvents.filter(e => e && e.status === 'rejected');
    displayEventsInTab('rejectedEventsList', rejectedEvents, 'rejected');
}

function loadAllEvents() {
    const allEvents = eventStore.getAllEvents();
    displayEventsInTab('allEventsList', allEvents, 'all');
}

function loadDeletedEvents() {
    const deletedEvents = JSON.parse(localStorage.getItem('deleted_events') || '[]');
    const container = document.getElementById('deletedEventsList');
    
    if (!container) return;
    
    if (deletedEvents.length === 0) {
        container.innerHTML = '<div class="empty-state">No deleted events</div>';
        return;
    }
    
    container.innerHTML = deletedEvents.reverse().map(event => `
        <div class="event-card" style="opacity: 0.7; background: #f8fafc;">
            <div style="display: flex; justify-content: space-between;">
                <div>
                    <h3 style="color: #666;">${event.title || 'Untitled'}</h3>
                    <p style="color: #999; margin: 5px 0;">📅 ${event.date ? new Date(event.date).toLocaleDateString() : 'TBD'}</p>
                    <p style="color: #999;">🗑️ Deleted: ${new Date(event.deletedAt).toLocaleString()}</p>
                    <p style="color: #999;">👤 Deleted by: ${event.deletedBy || 'admin'}</p>
                    <p style="color: #999;">👥 Original organizer: ${event.organizer?.name || 'Unknown'}</p>
                </div>
                <span class="badge badge-danger">Deleted</span>
            </div>
        </div>
    `).join('');
}

function displayEventsInTab(containerId, events, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    if (events.length === 0) {
        container.innerHTML = `<div class="empty-state">No ${type} events found</div>`;
        return;
    }
    
    container.innerHTML = events.map(event => `
        <div class="event-card" id="event-${event.id}">
            <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap;">
                <div style="flex: 1;">
                    <h3>${event.title || 'Untitled'}</h3>
                    <p style="color: var(--gray); margin: 5px 0;">${event.description?.substring(0, 100)}...</p>
                    <div style="display: flex; gap: 15px; margin: 10px 0; font-size: 0.9rem; flex-wrap: wrap;">
                        <span>📅 ${event.date ? new Date(event.date).toLocaleDateString() : 'TBD'}</span>
                        <span>📍 ${event.location || 'TBD'}</span>
                        <span>👤 ${event.organizer?.name || 'Unknown'}</span>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <span class="badge badge-${event.status || 'pending'}">${event.status || 'pending'}</span>
                        <span>👥 ${event.registeredCount || 0} registrations</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn btn-outline" onclick="window.location.href='event-details.html?id=${event.id}'">View</button>
                    <button class="btn-danger" onclick="confirmDeleteEvent('${event.id}', '${event.title.replace(/'/g, "\\'")}')">🗑️ Delete</button>
                </div>
            </div>
        </div>
    `).join('');
}







    // ===== MODAL FUNCTIONS =====
    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.add('active');
    }

    function hideModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) modal.classList.remove('active');
    }

    // ===== INITIALIZATION =====
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Admin page loading...');
        
        // Check authentication
        checkAuth();
        
        // Small delay to ensure auth is complete
        setTimeout(function() {
            const user = getCurrentUser();
            console.log('Current user:', user);
            
            if (!user || user.role !== 'admin') {
                alert('Access denied. Admin only.');
                window.location.href = 'index.html';
                return;
            }
            
            // Load events
            loadPendingEvents();
        }, 100);
    });

    // Listen for events updates
    window.addEventListener('eventsUpdated', function() {
        console.log('Events updated, reloading...');
        allEvents = eventStore.getAllEvents();
        updateStats(allEvents);
        displayEvents(allEvents);
    });

    // Make functions global
    window.filterEvents = filterEvents;
    window.approveEvent = approveEvent;
    window.showRejectionModal = showRejectionModal;
    window.closeRejectionModal = closeRejectionModal;
    window.confirmRejection = confirmRejection;
    window.confirmDeleteEvent = confirmDeleteEvent;
    window.showModal = showModal;
    window.hideModal = hideModal;
</script>
