<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pending Approvals</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pending-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .pending-header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }
        
        .pending-tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .pending-tab {
            padding: 10px 20px;
            background: #f8fafc;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .pending-tab:hover {
            background: var(--gradient);
            color: white;
        }
        
        .pending-tab.active {
            background: var(--gradient);
            color: white;
        }
        
        .pending-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid #f59e0b;
            transition: all 0.3s;
        }
        
        .pending-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-hover);
        }
        
        .pending-card.approved {
            border-left-color: #10b981;
        }
        
        .pending-card.rejected {
            border-left-color: #ef4444;
            opacity: 0.8;
        }
        
        .pending-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .pending-title {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .pending-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: #f59e0b20;
            color: #f59e0b;
        }
        
        .badge-approved {
            background: #10b98120;
            color: #10b981;
        }
        
        .badge-rejected {
            background: #ef444420;
            color: #ef4444;
        }
        
        .organizer-info {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .organizer-avatar {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .approve-btn {
            background: #10b981;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
            min-width: 150px;
        }
        
        .approve-btn:hover {
            background: #0ea271;
        }
        
        .reject-btn {
            background: #ef4444;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
            min-width: 150px;
        }
        
        .reject-btn:hover {
            background: #dc2626;
        }
        
        .rejection-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .rejection-modal.active {
            display: flex;
        }
        
        .rejection-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        
        .rejection-content textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            font-family: inherit;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea20, #764ba220);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
        }
        
        .empty-state h3 {
            margin: 20px 0;
            color: var(--gray);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'">
            🚀 CampusConnect Admin
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="admin-pending.html" class="active">Pending Approvals</a>
            <div id="adminInfo">
                <span class="badge badge-info" style="margin-right: 10px;">Admin</span>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="pending-container">
        <div class="pending-header">
            <h1>👑 Event Approvals Dashboard</h1>
            <p style="color: var(--gray); margin-top: 10px;">Review and approve events submitted by organizers</p>
            
            <div class="stats-grid" id="statsGrid">
                <div class="stat-box">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div>Pending</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="approvedCount">0</div>
                    <div>Approved</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="rejectedCount">0</div>
                    <div>Rejected</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalEvents">0</div>
                    <div>Total</div>
                </div>
            </div>
            
            <div class="pending-tabs">
                <button class="pending-tab active" onclick="filterEvents('pending')">⏳ Pending</button>
                <button class="pending-tab" onclick="filterEvents('approved')">✅ Approved</button>
                <button class="pending-tab" onclick="filterEvents('rejected')">❌ Rejected</button>
                <button class="pending-tab" onclick="filterEvents('all')">📋 All</button>
            </div>
        </div>

        <div id="pendingEventsList">
            <div class="empty-state">
                <div style="font-size: 3rem;">📋</div>
                <h3>Loading events...</h3>
            </div>
        </div>
    </div>

    <!-- Rejection Modal -->
    <div class="rejection-modal" id="rejectionModal">
        <div class="rejection-content">
            <h2 style="margin-bottom: 20px;">Reject Event</h2>
            <p style="color: var(--gray); margin-bottom: 10px;">Please provide feedback for the organizer:</p>
            <textarea id="rejectionReason" placeholder="Why is this event being rejected? (e.g., incomplete details, not suitable, etc.)"></textarea>
            <div style="display: flex; gap: 15px;">
                <button class="reject-btn" onclick="confirmRejection()">Send Rejection</button>
                <button class="btn btn-outline" onclick="closeRejectionModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/data-store.js"></script>
<script src="js/auth.js"></script>
<script src="js/email-templates.js"></script>
<script src="js/email-service.js"></script>
    <script>
        let currentEventId = null;
        let currentFilter = 'pending';

        function loadPendingEvents() {
            const container = document.getElementById('pendingEventsList');
            const allEvents = eventStore.getAllEvents();
            
            updateStats(allEvents);
            displayEvents(allEvents);
        }

        function displayEvents(events) {
            const container = document.getElementById('pendingEventsList');
            
            const filteredEvents = events.filter(event => {
                if (currentFilter === 'all') return true;
                return event.status === currentFilter;
            });

            if (filteredEvents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3rem;">📭</div>
                        <h3>No ${currentFilter} events</h3>
                        <p style="color: var(--gray); margin-top: 10px;">Check back later or try another filter</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredEvents.map(event => `
                <div class="pending-card ${event.status}" id="event-${event.id}">
                    <div class="pending-header-row">
                        <span class="pending-title">${event.title}</span>
                        <span class="pending-badge badge-${event.status}">
                            ${event.status.toUpperCase()}
                        </span>
                    </div>
                    
                    <p style="color: var(--gray); margin: 10px 0;">${event.description}</p>
                    
                    <div style="display: flex; gap: 20px; margin: 10px 0; flex-wrap: wrap;">
                        <span>📅 ${new Date(event.date).toLocaleDateString()}</span>
                        <span>📍 ${event.location || 'TBD'}</span>
                        <span>⏰ Submitted: ${new Date(event.submittedAt).toLocaleString()}</span>
                    </div>

                    <div class="organizer-info">
                        <div class="organizer-avatar">${(event.organizer?.name || 'U').charAt(0)}</div>
                        <div style="flex: 1;">
                            <h4>${event.organizer?.name || 'Unknown'}</h4>
                            <p style="color: var(--gray);">${event.organizer?.email || 'No email'}</p>
                        </div>
                    </div>

                    ${event.status === 'pending' ? `
                        <div class="action-buttons">
                            <button class="approve-btn" onclick="approveEvent('${event.id}')">
                                ✓ Approve & Publish
                            </button>
                            <button class="reject-btn" onclick="showRejectionModal('${event.id}')">
                                ✗ Reject
                            </button>
                        </div>
                    ` : event.status === 'approved' ? `
                        <div style="background: #10b98120; padding: 15px; border-radius: 10px; color: #10b981; margin-top: 15px;">
                            ✓ Approved on ${new Date(event.approvedAt).toLocaleString()}
                        </div>
                    ` : event.status === 'rejected' ? `
                        <div style="background: #ef444420; padding: 15px; border-radius: 10px; color: #ef4444; margin-top: 15px;">
                            ✗ Rejected: ${event.rejectionReason || 'Not specified'}
                            <br>
                            <small>${new Date(event.rejectedAt).toLocaleString()}</small>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function updateStats(events) {
            document.getElementById('pendingCount').textContent = events.filter(e => e.status === 'pending').length;
            document.getElementById('approvedCount').textContent = events.filter(e => e.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = events.filter(e => e.status === 'rejected').length;
            document.getElementById('totalEvents').textContent = events.length;
        }

        function approveEvent(eventId) {
            if (confirm('Approve this event? It will appear on the main events page immediately.')) {
                eventStore.approveEvent(eventId);
                
                // Show email preview
                const event = eventStore.getAllEvents().find(e => e.id === eventId);
                if (event && window.emailService) {
                    emailService.sendEventApproved(
                        event.organizer.email,
                        event.organizer.name,
                        event.title
                    );
                }
                
                loadPendingEvents();
                alert('✅ Event approved and is now live!');
            }
        }

        function showRejectionModal(eventId) {
            currentEventId = eventId;
            document.getElementById('rejectionModal').classList.add('active');
        }

        function closeRejectionModal() {
            document.getElementById('rejectionModal').classList.remove('active');
            document.getElementById('rejectionReason').value = '';
        }

        function confirmRejection() {
            const reason = document.getElementById('rejectionReason').value;
            if (!reason) {
                alert('Please provide a reason for rejection');
                return;
            }

            eventStore.rejectEvent(currentEventId, reason);
            
            // Show email preview
            const event = eventStore.getAllEvents().find(e => e.id === currentEventId);
            if (event && window.emailService) {
                emailService.sendEventRejected(
                    event.organizer.email,
                    event.organizer.name,
                    event.title,
                    reason
                );
            }
            
            loadPendingEvents();
            closeRejectionModal();
            alert('❌ Event rejected. Feedback sent to organizer.');
        }

        function filterEvents(filter) {
            currentFilter = filter;
            document.querySelectorAll('.pending-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            const allEvents = eventStore.getAllEvents();
            displayEvents(allEvents);
        }

        // Listen for events updates
        window.addEventListener('eventsUpdated', function() {
            loadPendingEvents();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            
            // Check if admin
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Access denied. Admin only.');
                window.location.href = 'index.html';
                return;
            }
            
            loadPendingEvents();
        });

        // Make functions global
        window.filterEvents = filterEvents;
        window.approveEvent = approveEvent;
        window.showRejectionModal = showRejectionModal;
        window.closeRejectionModal = closeRejectionModal;
        window.confirmRejection = confirmRejection;
    </script>
</body>
</html>
